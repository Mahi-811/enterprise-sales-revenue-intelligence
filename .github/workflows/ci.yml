name: Enterprise BI Validation & Reconciliation CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  validate-and-reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Execute Synthetic Data Generation
        run: |
          python data/generate_data.py

      - name: Execute Profiling & Anomaly Detection Audit
        run: |
          python tests/run_profiling.py

      - name: Execute Reconciliation & Acceptance Tests (AC-01 to AC-09)
        run: |
          python tests/test_reconciliation.py

      - name: Upload Reconciliation Audit Report
        uses: actions/upload-artifact@v4
        with:
          name: reconciliation-audit-report
          path: docs/RECONCILIATION_REPORT.md
